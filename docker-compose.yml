version: '3.8'

services:
  gymapp:
    build:
      context: ./frontend
      args:
        - VITE_APP_NAME=${VITE_APP_NAME}
        - VITE_API_URL=${VITE_API_URL}
        - VITE_SERVER_URL=${VITE_SERVER_URL}
    env_file:
      - ./frontend/.env
    restart: always
    networks:
      - gymapp-red
  gymapp-backend:
    build: backend/
    restart: always
    env_file:
      - backend/.env
    networks:
      - gymapp-red

  proxy_gateway:
    image: nginx
    restart: always
    ports:
      - 80:80
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gymapp
      - gymapp-backend
    networks:
      - gymapp-red

networks:
  gymapp-red:
    driver: bridge